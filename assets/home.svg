<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 340" width="100%" height="100%">
  <!-- Ground line -->
  <path d="M20 315 L480 315" stroke="#2b2024" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Silhouette of Home and Surroundings -->
  <g fill="#2b2024">
    <!-- Left foliage / trees -->
    <path d="M30 315 C25 285 40 250 65 240 C55 220 75 190 100 195 C115 170 145 175 155 200 C170 200 185 220 180 245 C190 260 185 295 175 315 Z"/>
    
    <!-- Right foliage / trees -->
    <path d="M325 315 C320 280 335 240 360 230 C350 205 375 175 400 185 C415 160 445 170 455 195 C470 205 480 235 470 265 C480 285 475 305 465 315 Z"/>

    <!-- Chimney with smoke -->
    <rect x="300" y="70" width="22" height="60" rx="2"/>
    <path d="M295 68 L327 68 L324 73 L298 73 Z"/>

    <!-- Main House Structure -->
    <!-- Center Gable / Main body -->
    <polygon points="250,55 150,150 160,150 160,315 340,315 340,150 350,150"/>
    
    <!-- Left Wing -->
    <polygon points="120,170 160,135 160,315 105,315 105,185"/>

    <!-- Right Wing -->
    <polygon points="340,135 380,170 395,185 395,315 340,315"/>

    <!-- Roof trims & eaves -->
    <path d="M250 48 L142 152 L148 158 L250 62 L352 158 L358 152 Z"/>
    <path d="M160 130 L100 182 L105 187 L160 138 Z"/>
    <path d="M340 138 L395 187 L400 182 L340 130 Z"/>

    <!-- Porch / Front Entrance Roof -->
    <polygon points="250,215 205,248 295,248"/>
    <path d="M250 210 L198 250 L204 254 L250 218 L296 254 L302 250 Z"/>
    
    <!-- Porch Columns -->
    <rect x="212" y="248" width="6" height="67"/>
    <rect x="282" y="248" width="6" height="67"/>
    
    <!-- Porch Railing -->
    <rect x="204" y="285" width="22" height="4"/>
    <rect x="274" y="285" width="22" height="4"/>
    <rect x="208" y="289" width="3" height="26"/>
    <rect x="216" y="289" width="3" height="26"/>
    <rect x="278" y="289" width="3" height="26"/>
    <rect x="286" y="289" width="3" height="26"/>

    <!-- Front Steps -->
    <rect x="222" y="307" width="56" height="4" rx="1"/>
    <rect x="218" y="311" width="64" height="4" rx="1"/>
  </g>

  <!-- Cut-out details (white / inverse for windows and doors) -->
  <g fill="#ffffff">
    <!-- Front Door with Arch -->
    <path d="M236 307 L236 260 C236 253 264 253 264 260 L264 307 Z"/>
    <circle cx="260" cy="285" r="1.5" fill="#2b2024"/>

    <!-- Attic / Dormer Circular Window -->
    <circle cx="250" cy="115" r="15"/>
    <circle cx="250" cy="115" r="13" fill="#2b2024"/>
    <!-- Window panes cross -->
    <path d="M250 102 L250 128 M237 115 L263 115" stroke="#ffffff" stroke-width="2"/>

    <!-- Upper Floor Left Window -->
    <rect x="185" y="165" width="24" height="34" rx="3"/>
    <rect x="187" y="167" width="20" height="30" rx="2" fill="#2b2024"/>
    <path d="M197 167 L197 197 M187 180 L207 180" stroke="#ffffff" stroke-width="1.8"/>

    <!-- Upper Floor Right Window -->
    <rect x="291" y="165" width="24" height="34" rx="3"/>
    <rect x="293" y="167" width="20" height="30" rx="2" fill="#2b2024"/>
    <path d="M303 167 L303 197 M293 180 L313 180" stroke="#ffffff" stroke-width="1.8"/>

    <!-- Left Wing Windows -->
    <rect x="120" y="210" width="22" height="32" rx="3"/>
    <rect x="122" y="212" width="18" height="28" rx="2" fill="#2b2024"/>
    <path d="M131 212 L131 240 M122 224 L140 224" stroke="#ffffff" stroke-width="1.6"/>

    <rect x="120" y="260" width="22" height="34" rx="3"/>
    <rect x="122" y="262" width="18" height="30" rx="2" fill="#2b2024"/>
    <path d="M131 262 L131 292 M122 275 L140 275" stroke="#ffffff" stroke-width="1.6"/>

    <!-- Right Wing Windows -->
    <rect x="358" y="210" width="22" height="32" rx="3"/>
    <rect x="360" y="212" width="18" height="28" rx="2" fill="#2b2024"/>
    <path d="M369 212 L369 240 M360 224 L378 224" stroke="#ffffff" stroke-width="1.6"/>

    <rect x="358" y="260" width="22" height="34" rx="3"/>
    <rect x="360" y="262" width="18" height="30" rx="2" fill="#2b2024"/>
    <path d="M369 262 L369 292 M360 275 L378 275" stroke="#ffffff" stroke-width="1.6"/>

    <!-- Window flower boxes -->
    <rect x="182" y="198" width="30" height="4" rx="1" fill="#2b2024"/>
    <rect x="288" y="198" width="30" height="4" rx="1" fill="#2b2024"/>
  </g>

  <!-- Sweet gentle chimney smoke heart -->
  <g fill="none" stroke="#e5a0ae" stroke-width="2.5" stroke-linecap="round" opacity="0.85">
    <path d="M312 60 C312 48 325 40 330 30 C332 26 338 24 342 28 C346 32 342 38 335 44 C330 48 325 54 325 60"/>
    <!-- Small heart above chimney -->
    <path d="M344 22 C342 16 334 16 334 22 C334 27 344 33 344 33 C344 33 354 27 354 22 C354 16 346 16 344 22 Z" fill="#e5a0ae" stroke="none" opacity="0.9"/>
  </g>
</svg>
